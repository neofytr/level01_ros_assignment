bt_navigator:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: base_footprint

controller_server:
  ros__parameters:
    use_sim_time: true
    min_y_velocity_threshold: 0.5
    failure_tolerance: 0.3
    progress_checker:
      movement_time_allowance: 15.0
    FollowPath:
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign",
                "PathDist", "GoalDist"]
      max_vel_x: 0.26
      max_vel_theta: 1.0
      max_speed_xy: 0.26
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_theta: -3.2
      linear_granularity: 0.05
      transform_tolerance: 0.5
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 11.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.25
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 11.0
          obstacle_max_range: 10.0
      inflation_layer:
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: base_footprint
    transform_tolerance: 0.5

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
